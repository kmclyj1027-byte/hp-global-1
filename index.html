<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SMTC - Sunday Morning Tennis Club</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SMTC">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/깃허브아이디/저장소명/main/icon.png">

<style>
/* 디자인 시스템 */
:root { --primary: #1D9E75; --dark: #1a6b3a; --danger: #E24B4A; --bg: #f5f5f5; }
*{box-sizing:border-box;margin:0;padding:0; -webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:#1a1a1a;}
.app{max-width:480px;margin:0 auto;padding:1rem 1rem 5rem;min-height:100vh;}

/* 헤더 & 인포바 */
.header{background:linear-gradient(135deg,#1a6b3a 0%,#1D9E75 100%); border-radius:14px;padding:1.1rem 1.25rem;margin-bottom:1rem;color:#fff;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 15px rgba(29,158,117,0.2);}
.info-bar{background:#0c3547; border-radius:10px;padding:12px;margin-bottom:10px;color:#fff;}
.court-schedule{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.court-item{background:rgba(255,255,255,0.1); border-radius:8px;padding:8px;text-align:center;font-size:11px;}

/* 회비 납부 안내 카드 */
.fee-card{background:#fff; border:1px solid var(--primary); border-radius:12px; padding:15px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;}
.fee-info b { font-size:15px; color:var(--dark); }

/* 네비게이션 */
.nav{display:flex;gap:4px;margin-bottom:1rem;background:#eee;padding:4px;border-radius:10px;position:sticky;top:10px;z-index:90;}
.nav button{flex:1;padding:10px 0;border:none;background:transparent;font-size:12px;color:#888;cursor:pointer;border-radius:7px;font-weight:600;}
.nav button.active{background:#fff;color:#1a1a1a;box-shadow:0 2px 5px rgba(0,0,0,0.1);}

/* 카드 및 컴포넌트 */
.section{display:none; animation: fadeIn 0.3s;}
.section.active{display:block;}
@keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
.card{background:#fff;border-radius:12px;padding:1.25rem;margin-bottom:12px;border:1px solid #eee;}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 15px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-danger{background:#fff; border:1px solid var(--danger); color:var(--danger);}
.btn-sm{padding:5px 10px; font-size:11px;}

/* 리스트 스타일 */
.member-row, .rank-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f0f0f0;}
.avatar{width:36px;height:36px;border-radius:50%;background:#E6F1FB;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:var(--primary);}
.member-info{flex:1;}
.badge{padding:2px 8px; border-radius:10px; font-size:10px; font-weight:700;}
.badge-a{background:#E6F1FB; color:#185FA5;}
.badge-paid{background:#EAF3DE; color:#3B6D11;}

/* 토스트 알림 */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:#fff;padding:10px 20px;border-radius:30px;font-size:13px;z-index:1000;display:none;}

/* 매칭표 스타일 */
.court-block{border:1px solid #eee;border-radius:10px;padding:12px;margin-bottom:10px;}
.match-row{display:flex;justify-content:space-between;align-items:center;margin:10px 0;}
.vs{color:#ccc;font-weight:bold;font-size:11px;}
.score-input{width:45px;padding:5px;text-align:center;border:1px solid #ddd;border-radius:4px;}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="app">
    <div class="header">
        <div>
            <div style="font-size:22px;font-weight:800;letter-spacing:-0.5px;">🎾 SMTC</div>
            <div style="font-size:10px;opacity:0.8;">Sunday Morning Tennis Club</div>
        </div>
        <div id="adminBadge" style="font-size:10px; background:rgba(0,0,0,0.2); padding:4px 8px; border-radius:10px;">Guest Mode</div>
    </div>

    <div class="info-bar">
        <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:600;">
            <span>일요일 06:00 – 08:00</span>
            <span style="color:#FFD700;">마감: 토요일 20:00</span>
        </div>
        <div class="court-schedule">
            <div class="court-item"><b>1코트 (전체)</b><br>06:00 – 08:00</div>
            <div class="court-item"><b>2코트 (초반)</b><br>06:00 – 07:00</div>
        </div>
    </div>

    <div class="fee-card">
        <div class="fee-info">
            <b>신한 110-123-456789</b><br>
            <span style="font-size:12px;color:#666;">예금주: 홍길동 (SMTC 회비)</span>
        </div>
        <button class="btn btn-primary btn-sm" onclick="copyAccount('110123456789')">복사</button>
    </div>

    <div class="nav">
        <button class="active" onclick="showTab('home',this)">참여신청</button>
        <button onclick="showTab('matching',this)">매칭표</button>
        <button onclick="showTab('results',this)">결과입력</button>
        <button onclick="showTab('accounting',this)">회계장부</button>
        <button onclick="showTab('rank',this)">랭킹</button>
    </div>

    <div id="home" class="section active">
        <div class="card">
            <div style="display:flex;justify-content:space-between;margin-bottom:15px;">
                <span class="section-title" style="margin:0;">이번 주 참여자</span>
                <span id="attCount" class="badge badge-a">0명</span>
            </div>
            <div id="attList" class="chip-wrap"></div>
        </div>
    </div>

    <div id="matching" class="section">
        <div style="display:flex;justify-content:space-between;margin-bottom:15px;">
            <span class="section-title" style="margin:0;">대진표</span>
            <button class="btn btn-primary btn-sm" onclick="generateMatching()">매칭생성(Admin)</button>
        </div>
        <div id="matchDisplay"></div>
    </div>

    <div id="results" class="section">
        <div style="display:flex;justify-content:space-between;margin-bottom:15px;">
            <span class="section-title" style="margin:0;">스코어 입력</span>
            <button class="btn btn-danger btn-sm" onclick="prepareNextWeek()">새 주차 초기화</button>
        </div>
        <div id="scoreList"></div>
    </div>

    <div id="accounting" class="section">
        <div class="stat-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px;">
            <div class="card" style="text-align:center;margin:0;padding:15px;">
                <div id="accIncome" style="font-size:18px;font-weight:800;color:var(--primary);">0</div>
                <div style="font-size:11px;color:#888;">총 수입</div>
            </div>
            <div class="card" style="text-align:center;margin:0;padding:15px;">
                <div id="accBalance" style="font-size:18px;font-weight:800;">0</div>
                <div style="font-size:11px;color:#888;">현재 잔액</div>
            </div>
        </div>
        <div class="card" id="accLogs"></div>
    </div>

    <div id="rank" class="section">
        <div class="card" id="rankList"></div>
    </div>
</div>

<script>
// 1. 초기 데이터 및 설정
const SHEET_ID = '15T4MShNg2LbuKn9897qoojPZKRUWzDqOYNrvdDPmCCw';
const ADMIN_PW = '0600'; // 관리자 암호 설정
let isAdmin = false;

const DB = {
    get(k){ return JSON.parse(localStorage.getItem('smtc_'+k) || 'null'); },
    set(k,v){ localStorage.setItem('smtc_'+k, JSON.stringify(v)); }
};

// 2. 관리자 인증 시스템
function authAdmin() {
    if (isAdmin) return true;
    const pw = prompt("관리자 암호를 입력하세요.");
    if (pw === ADMIN_PW) {
        isAdmin = true;
        document.getElementById('adminBadge').textContent = "Admin Mode";
        document.getElementById('adminBadge').style.background = "var(--primary)";
        return true;
    }
    toast("권한이 없습니다.");
    return false;
}

// 3. 데이터 로딩 (실시간 시트 연동)
// 실제 운영시에는 fetch(구글시트URL)를 사용하며, 여기서는 초기 로직을 구현합니다.
const MEMBERS = [
    {id:'M01', name:'박진민', eng:'park jin min', gender:'M', grade:'A'},
    {id:'M02', name:'김승창', eng:'kim seung chang', gender:'M', grade:'A'},
    {id:'M03', name:'홍정석', eng:'hong jung suk', gender:'M', grade:'A'},
    {id:'M04', name:'최진규', eng:'choi jin gyu', gender:'M', grade:'A'},
    {id:'M05', name:'배양병', eng:'bae yang byoung', gender:'M', grade:'A'},
    {id:'M06', name:'박진호', eng:'park jin ho', gender:'M', grade:'A'},
    {id:'M07', name:'손명연', eng:'myoung yeun', gender:'F', grade:'B'},
    {id:'M08', name:'함승규', eng:'ham seung kyu', gender:'M', grade:'B'},
    {id:'M09', name:'이용준', eng:'lee yong joon', gender:'M', grade:'B'},
    {id:'M10', name:'고용우', eng:'ko yong woo', gender:'M', grade:'B'},
    {id:'M11', name:'세르게이', eng:'sergey', gender:'M', grade:'A'},
    {id:'M12', name:'체리', eng:'cherry', gender:'F', grade:'C'},
    {id:'M13', name:'빈세트', eng:'vincent', gender:'M', grade:'A'}
];

// 4. 핵심 기능 로직
const ROUNDS = [
    {label:'1라운드', time:'06:00', courts:[1, 2], mixed:true},
    {label:'2라운드', time:'06:30', courts:[1, 2], mixed:false},
    {label:'3라운드', time:'07:00', courts:[1], mixed:false},
    {label:'4라운드', time:'07:30', courts:[1], mixed:false}
];

function toggleAttend(id) {
    let att = DB.get('attendees') || [];
    const idx = att.indexOf(id);
    if(idx > -1) att.splice(idx, 1);
    else att.push(id);
    DB.set('attendees', att);
    renderHome();
}

function generateMatching() {
    if(!authAdmin()) return;
    const attIds = DB.get('attendees') || [];
    if(attIds.length < 4) { toast("최소 4명이 필요합니다."); return; }
    
    const players = MEMBERS.filter(m => attIds.includes(m.id));
    const allMatches = [];
    
    ROUNDS.forEach(r => {
        let pool = [...players].sort(() => Math.random() - 0.5);
        const roundMatches = [];
        r.courts.forEach(c => {
            if(pool.length >= 4) {
                roundMatches.push({
                    court: c,
                    teamA: [pool.shift(), pool.shift()],
                    teamB: [pool.shift(), pool.shift()],
                    scoreA: null, scoreB: null
                });
            }
        });
        allMatches.push({ ...r, matches: roundMatches, waiting: pool });
    });
    DB.set('matches', allMatches);
    renderMatching();
    toast("매칭이 생성되었습니다.");
}

function saveScore(ri, gi) {
    if(!authAdmin()) return;
    const matches = DB.get('matches');
    const sA = parseInt(document.getElementById(`sA_${ri}_${gi}`).value);
    const sB = parseInt(document.getElementById(`sB_${ri}_${gi}`).value);
    
    if(isNaN(sA) || isNaN(sB)) return;
    
    const game = matches[ri].matches[gi];
    game.scoreA = sA;
    game.scoreB = sB;
    
    // 전적 누적 로직
    const stats = DB.get('stats') || {};
    const updatePlayer = (p, win, draw, lose) => {
        if(!stats[p.id]) stats[p.id] = {w:0, d:0, l:0};
        stats[p.id].w += win; stats[p.id].d += draw; stats[p.id].l += lose;
    };
    
    const isWinA = sA > sB;
    const isDraw = sA === sB;
    
    game.teamA.forEach(p => updatePlayer(p, isWinA?1:0, isDraw?1:0, (!isWinA&&!isDraw)?1:0));
    game.teamB.forEach(p => updatePlayer(p, !isWinA?1:0, isDraw?1:0, (isWinA&&!isDraw)?1:0));
    
    DB.set('matches', matches);
    DB.set('stats', stats);
    toast("결과가 저장 및 누적되었습니다.");
}

function prepareNextWeek() {
    if(!authAdmin()) return;
    if(!confirm("참여 신청과 대진표를 초기화하시겠습니까? (누적 전적은 유지)")) return;
    DB.set('attendees', []);
    DB.set('matches', []);
    renderHome();
    toast("새 주차 준비 완료");
}

// 5. 렌더링 시스템
function renderHome() {
    const attIds = DB.get('attendees') || [];
    document.getElementById('attCount').textContent = attIds.length + "명";
    let html = '<div class="chip-wrap" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">';
    MEMBERS.forEach(m => {
        const active = attIds.includes(m.id) ? 'on' : '';
        html += `<div class="chip ${active}" onclick="toggleAttend('${m.id}')" style="padding:12px;background:#fff;border:1px solid #eee;border-radius:10px;display:flex;justify-content:space-between;${active?'border-color:var(--primary);background:#f0faf5;':''}">
            <span><b>${m.name}</b> <small style="color:#888;">${m.grade}</small></span>
            <span>${active?'✔️':''}</span>
        </div>`;
    });
    document.getElementById('attList').innerHTML = html + '</div>';
}

function renderMatching() {
    const matches = DB.get('matches') || [];
    const container = document.getElementById('matchDisplay');
    if(!matches.length) { container.innerHTML = '<div style="text-align:center;padding:40px;color:#aaa;">생성된 매칭이 없습니다.</div>'; return; }
    
    container.innerHTML = matches.map((r, ri) => `
        <div class="round-header" style="background:#eee;padding:8px 12px;border-radius:8px;margin-top:15px;font-size:13px;font-weight:700;">
            ${r.label} (${r.time}) - ${r.courts.length}코트
        </div>
        ${r.matches.map(m => `
            <div class="court-block">
                <div style="font-size:11px;color:var(--primary);font-weight:800;margin-bottom:5px;">${m.court}번 코트</div>
                <div class="match-row">
                    <div class="team-a">${m.teamA.map(p=>p.name).join('<br>')}</div>
                    <div class="vs">VS</div>
                    <div class="team-b">${m.teamB.map(p=>p.name).join('<br>')}</div>
                </div>
            </div>
        `).join('')}
    `).join('');
}

function renderResults() {
    const matches = DB.get('matches') || [];
    const container = document.getElementById('scoreList');
    container.innerHTML = matches.map((r, ri) => r.matches.map((m, gi) => `
        <div class="card">
            <div style="font-size:11px;margin-bottom:8px;">${r.label} - ${m.court}코트</div>
            <div style="display:flex;align-items:center;justify-content:space-between;">
                <div style="flex:1;text-align:right;">${m.teamA.map(p=>p.name).join('/')}</div>
                <div style="margin:0 15px;display:flex;gap:5px;">
                    <input type="number" id="sA_${ri}_${gi}" class="score-input" value="${m.scoreA||''}">
                    <input type="number" id="sB_${ri}_${gi}" class="score-input" value="${m.scoreB||''}">
                </div>
                <div style="flex:1;">${m.teamB.map(p=>p.name).join('/')}</div>
            </div>
            <button class="btn btn-primary btn-sm" style="width:100%;margin-top:10px;" onclick="saveScore(${ri},${gi})">결과 저장</button>
        </div>
    `).join('')).join('');
}

function renderRank() {
    const stats = DB.get('stats') || {};
    const ranked = [...MEMBERS].map(m => ({ ...m, ...stats[m.id] || {w:0, d:0, l:0} }))
        .sort((a,b) => (b.w * 3 + b.d) - (a.w * 3 + a.d));
        
    document.getElementById('rankList').innerHTML = `
        <div style="font-size:14px;font-weight:700;margin-bottom:15px;">🏆 클럽 랭킹</div>
        ${ranked.map((m, i) => `
            <div class="rank-row">
                <div style="width:25px;font-weight:800;color:${i<3?'#BA7517':'#ccc'};">${i+1}</div>
                <div class="avatar">${m.name[0]}</div>
                <div class="member-info">
                    <div><b>${m.name}</b> <span class="badge badge-a">${m.grade}</span></div>
                    <div style="font-size:11px;color:#888;">${m.w}승 ${m.d}무 ${m.l}패</div>
                </div>
                <div style="font-weight:800;color:var(--primary);">${(m.w*3+m.d)}pt</div>
            </div>
        `).join('')}
    `;
}

function renderAccounting() {
    // 예시 데이터 (실제로는 구글 시트에서 불러옴)
    const logs = [
        {date:'05-11', title:'5월 회비 입금', amount:300000},
        {date:'05-12', title:'윌슨 챔피언십 공 구매', amount:-56000}
    ];
    let income = 0; let total = 0;
    const logHtml = logs.map(l => {
        total += l.amount; if(l.amount > 0) income += l.amount;
        return `<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f9f9f9;font-size:13px;">
            <div><small style="color:#aaa;">${l.date}</small><div>${l.title}</div></div>
            <div style="font-weight:700;color:${l.amount>0?'var(--primary)':'var(--danger)'};">${l.amount.toLocaleString()}원</div>
        </div>`;
    }).join('');
    document.getElementById('accIncome').textContent = income.toLocaleString() + "원";
    document.getElementById('accBalance').textContent = total.toLocaleString() + "원";
    document.getElementById('accLogs').innerHTML = logHtml;
}

// 공통 함수
function showTab(id, btn) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    btn.classList.add('active');
    if(id === 'home') renderHome();
    if(id === 'matching') renderMatching();
    if(id === 'results') renderResults();
    if(id === 'rank') renderRank();
    if(id === 'accounting') renderAccounting();
}

function copyAccount(acc) {
    navigator.clipboard.writeText(acc).then(() => toast("계좌번호가 복사되었습니다."));
}

function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2000);
}

// 실행
renderHome();
</script>
</body>
</html>
