<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SMTC - Sunday Morning Tennis Club</title>
<style>
    :root { --primary: #1D9E75; --dark: #1a6b3a; --danger: #E24B4A; --bg: #f5f5f5; }
    *{box-sizing:border-box;margin:0;padding:0; -webkit-tap-highlight-color:transparent;}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:#1a1a1a;line-height:1.5;}
    .app{max-width:480px;margin:0 auto;padding:1rem 1rem 5rem;min-height:100vh;}
    
    .header{background:linear-gradient(135deg,#1a6b3a 0%,#1D9E75 100%); border-radius:14px;padding:1.1rem 1.25rem;margin-bottom:1rem;color:#fff;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 15px rgba(29,158,117,0.25);}
    .info-bar{background:#0c3547; border-radius:10px;padding:12px;margin-bottom:10px;color:#fff;}
    .court-schedule{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
    .court-item{background:rgba(255,255,255,0.1); border-radius:8px;padding:8px;text-align:center;font-size:11px;}

    .account-card{background:#fff; border:1px solid var(--primary); border-radius:12px; padding:15px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;}
    .account-info b { font-size:14px; color:var(--dark); }

    .nav{display:flex;gap:4px;margin-bottom:1rem;background:#eee;padding:4px;border-radius:10px;position:sticky;top:10px;z-index:90;}
    .nav button{flex:1;padding:10px 0;border:none;background:transparent;font-size:11px;color:#888;cursor:pointer;border-radius:7px;font-weight:600;}
    .nav button.active{background:#fff;color:#1a1a1a;box-shadow:0 2px 5px rgba(0,0,0,0.1);}

    .section{display:none;} .section.active{display:block;}
    .card{background:#fff;border-radius:12px;padding:1.25rem;margin-bottom:12px;border:1px solid #eee; overflow:hidden;}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:8px 12px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;}
    .btn-primary{background:var(--primary);color:#fff;}
    .btn-danger{background:var(--danger);color:#fff;}
    .btn-sm{padding:5px 10px; font-size:11px;}

    .admin-form { background:#f9f9f9; padding:12px; border-radius:10px; margin-bottom:15px; border:1px dashed #ccc; }
    input, select { width:100%; padding:8px; border:1px solid #ddd; border-radius:6px; font-size:13px; outline:none;}

    .match-card { border:1px solid #eee; border-radius:10px; padding:12px; margin-bottom:10px; background:#fafafa;}
    .team-box { display:flex; justify-content:space-between; align-items:center; background:#fff; padding:10px; border-radius:8px; border:1px solid #f0f0f0;}
    .team-names { flex:1; font-size:12px; font-weight:600; text-align:center;}
    .score-input-wrap { display:flex; gap:5px; align-items:center; justify-content:center; margin-top:10px; }
    .score-input { width:50px; text-align:center; font-weight:700; border:2px solid var(--primary); }

    .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:#fff;padding:10px 24px;border-radius:30px;font-size:13px;z-index:1000;display:none;}
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<div class="app">
    <div class="header">
        <div>
            <div style="font-size:20px;font-weight:800;">🎾 SMTC</div>
            <div id="adminStatus" style="font-size:10px; opacity:0.8;">Guest Mode</div>
        </div>
        <button class="btn btn-sm" style="background:rgba(255,255,255,0.2); color:#fff;" onclick="authAdmin()">Admin Login</button>
    </div>

    <div class="info-bar">
        <div style="display:flex;justify-content:space-between;font-size:11px;font-weight:600;">
            <span>일요일 06:00 – 08:00</span>
            <span style="color:#FFD700;">마감: 토요일 20:00</span>
        </div>
        <div class="court-schedule">
            <div class="court-item"><b>1코트 (전체)</b><br>06:00 – 08:00</div>
            <div class="court-item"><b>2코트 (초반)</b><br>06:00 – 07:00</div>
        </div>
    </div>

    <div class="account-card">
        <div class="account-info">
            <b>신한 110-473-359004</b><br>
            <span style="font-size:11px;color:#666;">예금주: 이용준 (SMTC 회비)</span>
        </div>
        <button class="btn btn-primary btn-sm" onclick="copyAccount('110473359004')">복사</button>
    </div>

    <div class="nav">
        <button class="active" onclick="showTab('home',this)">참여신청</button>
        <button onclick="showTab('matching',this)">매칭표</button>
        <button onclick="showTab('results',this)">결과입력</button>
        <button onclick="showTab('accounting',this)">회계</button>
        <button onclick="showTab('members',this)">랭킹</button>
    </div>

    <div id="home" class="section active">
        <div class="card">
            <div style="display:flex;justify-content:space-between;margin-bottom:15px;align-items:center;">
                <b style="font-size:15px;">이번 주 참여 명단</b>
                <span id="attTotal" class="btn-sm" style="background:#eee; border-radius:10px;">0명</span>
            </div>
            <div id="attList" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;"></div>
        </div>
    </div>

    <div id="matching" class="section">
        <div style="display:flex;justify-content:space-between;margin-bottom:12px;align-items:center;">
            <b>주간 대진표</b>
            <button class="btn btn-primary btn-sm" onclick="generateMatching()">대진 생성</button>
        </div>
        <div id="matchDisplay"></div>
    </div>

    <div id="results" class="section">
        <div style="display:flex;justify-content:space-between;margin-bottom:12px;align-items:center;">
            <b>경기 결과 입력</b>
            <button class="btn btn-danger btn-sm" onclick="resetWeeklyData()">주차 초기화</button>
        </div>
        <div id="resultInputArea"></div>
    </div>

    <div id="accounting" class="section">
        <div class="admin-form" style="background:#f0f7f4; border:1px solid var(--primary); margin-bottom:15px;">
            <b style="display:block; margin-bottom:10px; color:var(--dark);">💰 회계 장부 기입 (Admin)</b>
            <div style="display:flex; flex-direction:column; gap:8px;">
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
                    <input type="text" id="accDate" placeholder="날짜 (05.11)">
                    <input type="text" id="accCategory" placeholder="항목 (공구매 등)">
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
                    <input type="number" id="accIncome" placeholder="수입(+)">
                    <input type="number" id="accPay" placeholder="지출(-)">
                </div>
                <input type="text" id="accEtc" placeholder="비고 (특이사항)">
                <button class="btn btn-primary" onclick="addAccLog()" style="width:100%; padding:12px;">장부 기록 실행</button>
            </div>
        </div>
        <div class="card">
            <div id="accSummary" style="font-size:16px; font-weight:800; border-bottom:2px solid #eee; padding-bottom:10px; margin-bottom:10px;">현재 잔액: 0원</div>
            <div id="accLogs"></div>
        </div>
    </div>

    <div id="members" class="section">
        <div class="admin-form">
            <b style="font-size:13px;">👤 인원 추가</b>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:5px;margin-top:8px;">
                <input type="text" id="newName" placeholder="성함">
                <select id="newGrade"><option>A</option><option>B</option><option>C</option></select>
                <select id="newType"><option value="M">정회원</option><option value="G">게스트</option></select>
                <button class="btn btn-primary btn-sm" onclick="addPerson()">추가</button>
            </div>
        </div>
        <div class="card" id="rankArea"></div>
    </div>
</div>

<script>
let isAdmin = false;
const ADMIN_PW = '0600';

const DB = {
    get(k){ return JSON.parse(localStorage.getItem('smtc_'+k) || 'null'); },
    set(k,v){ localStorage.setItem('smtc_'+k, JSON.stringify(v)); }
};

const INITIAL_MEMBERS = [
    {id:'M01', name:'박진민', grade:'A', type:'M', w:0, l:0}, {id:'M02', name:'김승창', grade:'A', type:'M', w:0, l:0},
    {id:'M03', name:'홍정석', grade:'A', type:'M', w:0, l:0}, {id:'M04', name:'최진규', grade:'A', type:'M', w:0, l:0},
    {id:'M05', name:'배양병', grade:'A', type:'M', w:0, l:0}, {id:'M06', name:'박진호', grade:'A', type:'M', w:0, l:0},
    {id:'M07', name:'손명연', grade:'B', type:'M', w:0, l:0}, {id:'M08', name:'함승규', grade:'B', type:'M', w:0, l:0},
    {id:'M09', name:'이용준', grade:'B', type:'M', w:0, l:0}, {id:'M10', name:'고용우', grade:'B', type:'M', w:0, l:0},
    {id:'M11', name:'세르게이', grade:'A', type:'M', w:0, l:0}, {id:'M12', name:'체리', grade:'C', type:'M', w:0, l:0},
    {id:'M13', name:'빈센트', grade:'A', type:'M', w:0, l:0}
];

function authAdmin() {
    const pw = prompt("관리자 암호를 입력하세요.");
    if (pw === ADMIN_PW) {
        isAdmin = true;
        document.getElementById('adminStatus').textContent = "Admin Mode Active";
        toast("인증 성공"); return true;
    }
    toast("인증 실패"); return false;
}

function toggleAttend(id) {
    let att = DB.get('attendees') || [];
    const idx = att.indexOf(id);
    if(idx > -1) att.splice(idx, 1);
    else att.push(id);
    DB.set('attendees', att);
    renderHome();
}

function generateMatching() {
    if(!isAdmin && !authAdmin()) return;
    const attIds = DB.get('attendees') || [];
    if(attIds.length < 4) { toast("인원 부족(최소 4명)"); return; }
    const members = DB.get('members') || INITIAL_MEMBERS;
    const players = members.filter(m => attIds.includes(m.id));
    const rounds = [
        {label:'1라운드', time:'06:00', courts:[1, 2]}, {label:'2라운드', time:'06:30', courts:[1, 2]},
        {label:'3라운드', time:'07:00', courts:[1]}, {label:'4라운드', time:'07:30', courts:[1]}
    ];
    const matchData = rounds.map(r => {
        let pool = [...players].sort(() => Math.random() - 0.5);
        let matches = [];
        r.courts.forEach(c => {
            if(pool.length >= 4) {
                matches.push({ court: c, tA: [pool.shift(), pool.shift()], tB: [pool.shift(), pool.shift()], sA: null, sB: null, id: Date.now()+Math.random() });
            }
        });
        return { ...r, matches, wait: pool.map(p => p.name) };
    });
    DB.set('current_match', matchData);
    renderMatching();
    toast("매칭표 생성 완료");
}

function saveGameScore(rIdx, mIdx) {
    if(!isAdmin && !authAdmin()) return;
    const matchData = DB.get('current_match');
    const sA = parseInt(document.getElementById(`sA_${rIdx}_${mIdx}`).value);
    const sB = parseInt(document.getElementById(`sB_${rIdx}_${mIdx}`).value);
    if(isNaN(sA) || isNaN(sB)) { toast("점수를 입력하세요."); return; }
    const match = matchData[rIdx].matches[mIdx];
    match.sA = sA; match.sB = sB;
    let members = DB.get('members') || INITIAL_MEMBERS;
    const updateStats = (pList, isWin) => {
        pList.forEach(p => {
            const m = members.find(mem => mem.id === p.id);
            if(m) { if(isWin) m.w++; else m.l++; }
        });
    };
    if(sA !== sB) {
        updateStats(match.tA, sA > sB);
        updateStats(match.tB, sB > sA);
    }
    DB.set('current_match', matchData); DB.set('members', members);
    renderResults(); toast("결과 저장 완료");
}

function resetWeeklyData() {
    if(!isAdmin && !authAdmin()) return;
    if(confirm("초기화하시겠습니까?")) {
        DB.set('attendees', []); DB.set('current_match', null);
        renderHome(); renderMatching(); renderResults();
    }
}

function renderHome() {
    const members = DB.get('members') || INITIAL_MEMBERS;
    const attIds = DB.get('attendees') || [];
    document.getElementById('attTotal').textContent = attIds.length + "명";
    let html = '';
    members.forEach(m => {
        const active = attIds.includes(m.id);
        html += `<div onclick="toggleAttend('${m.id}')" style="padding:12px; border-radius:10px; border:1px solid ${active?'var(--primary)':'#eee'}; background:${active?'#f0faf5':'#fff'}; font-size:13px; cursor:pointer;">
            <b>${m.name}</b> <small style="color:#888;">${m.grade}</small>
            <span style="float:right;">${m.type==='G'?'(게) ':''}${active?'✔️':''}</span>
        </div>`;
    });
    document.getElementById('attList').innerHTML = html;
}

function renderMatching() {
    const data = DB.get('current_match');
    const area = document.getElementById('matchDisplay');
    if(!data) { area.innerHTML = '<div style="text-align:center;padding:40px;color:#aaa;">매칭표가 없습니다.</div>'; return; }
    area.innerHTML = data.map(r => `
        <div style="background:#eee; padding:8px 12px; border-radius:8px; margin-top:15px; font-size:12px; font-weight:800;">${r.label} (${r.time})</div>
        ${r.matches.map(m => `
            <div class="match-card">
                <div style="font-size:11px; color:var(--primary); font-weight:800;">${m.court}번 코트</div>
                <div class="team-box">
                    <div class="team-names">${m.tA.map(p=>p.name).join('<br>')}</div>
                    <div style="color:#ccc; font-weight:bold;">VS</div>
                    <div class="team-names">${m.tB.map(p=>p.name).join('<br>')}</div>
                </div>
            </div>
        `).join('')}
    `).join('');
}

function renderResults() {
    const data = DB.get('current_match');
    const area = document.getElementById('resultInputArea');
    if(!data) { area.innerHTML = '<div style="text-align:center;padding:40px;color:#aaa;">데이터 없음</div>'; return; }
    area.innerHTML = data.map((r, rIdx) => r.matches.map((m, mIdx) => `
        <div class="card">
            <div style="font-size:11px; color:#888; margin-bottom:8px;">${r.label} - ${m.court}번 코트</div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div style="flex:1; text-align:right; font-size:13px;"><b>${m.tA.map(p=>p.name).join('/')}</b></div>
                <div class="score-input-wrap">
                    <input type="number" id="sA_${rIdx}_${mIdx}" class="score-input" value="${m.sA!==null?m.sA:''}">
                    <span>:</span>
                    <input type="number" id="sB_${rIdx}_${mIdx}" class="score-input" value="${m.sB!==null?m.sB:''}">
                </div>
                <div style="flex:1; text-align:left; font-size:13px;"><b>${m.tB.map(p=>p.name).join('/')}</b></div>
            </div>
            <button class="btn btn-primary btn-sm" style="width:100%; margin-top:10px;" onclick="saveGameScore(${rIdx},${mIdx})">저장</button>
        </div>
    `).join('')).join('');
}

function renderRankArea() {
    const members = DB.get('members') || INITIAL_MEMBERS;
    let html = '<b style="display:block;margin-bottom:12px;">🏆 클럽 랭킹</b>';
    members.sort((a,b) => b.w - a.w).forEach((m, i) => {
        html += `<div style="display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid #f5f5f5;">
            <div style="width:20px; font-weight:800; color:${i<3?'var(--primary)':'#ccc'};">${i+1}</div>
            <div style="flex:1;"><b>${m.name}</b> <span style="font-size:10px; background:#eee; padding:2px 5px;">${m.type==='G'?'게스트':'정회원'}</span>
            <div style="font-size:11px; color:#888;">${m.grade}조 | ${m.w}승 ${m.l}패</div></div>
            <div style="font-weight:800; color:var(--primary);">${m.w}승</div>
        </div>`;
    });
    document.getElementById('rankArea').innerHTML = html;
}

// 회계 기능 확정 (시트3 항목 반영)
function addAccLog() {
    if(!isAdmin && !authAdmin()) return;
    const date = document.getElementById('accDate').value;
    const category = document.getElementById('accCategory').value;
    const income = parseInt(document.getElementById('accIncome').value) || 0;
    const pay = parseInt(document.getElementById('accPay').value) || 0;
    const etc = document.getElementById('accEtc').value;
    if (!date || !category) { alert("날짜와 항목을 입력해주세요."); return; }

    let logs = DB.get('accLog') || [];
    logs.unshift({ date, category, income, pay, etc, id: Date.now() });
    DB.set('accLog', logs);
    
    document.getElementById('accDate').value = ""; document.getElementById('accCategory').value = "";
    document.getElementById('accIncome').value = ""; document.getElementById('accPay').value = "";
    document.getElementById('accEtc').value = "";
    
    renderAccounting(); toast("회계 기록 성공");
}

function renderAccounting() {
    const logs = DB.get('accLog') || [];
    let totalIncome = 0; let totalPay = 0;
    let html = '';
    logs.forEach(l => {
        totalIncome += l.income; totalPay += l.pay;
        html += `<div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #f9f9f9; font-size:13px;">
            <div style="flex:1; min-width:0; padding-right:10px;">
                <div style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600;">${l.category}</div>
                <div style="font-size:10px; color:#aaa;">${l.date} ${l.etc ? '| '+l.etc : ''}</div>
            </div>
            <div style="font-weight:700; color:${l.income>0?'var(--primary)':'var(--danger)'};">
                ${l.income>0?'+'+l.income.toLocaleString():'-'+l.pay.toLocaleString()}원
            </div>
        </div>`;
    });
    document.getElementById('accSummary').textContent = `현재 잔액: ${(totalIncome - totalPay).toLocaleString()}원`;
    document.getElementById('accLogs').innerHTML = html || '<div style="text-align:center;padding:20px;color:#ccc;">내역 없음</div>';
}

function addPerson() {
    if(!isAdmin && !authAdmin()) return;
    const name = document.getElementById('newName').value;
    const grade = document.getElementById('newGrade').value;
    const type = document.getElementById('newType').value;
    if(!name) return;
    let members = DB.get('members') || INITIAL_MEMBERS;
    members.push({id: Date.now().toString(), name, grade, type, w:0, l:0});
    DB.set('members', members); renderRankArea();
}

function showTab(id, btn) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    btn.classList.add('active');
    if(id==='home') renderHome();
    if(id==='matching') renderMatching();
    if(id==='results') renderResults();
    if(id==='members') renderRankArea();
    if(id==='accounting') renderAccounting();
}

function copyAccount(acc) {
    navigator.clipboard.writeText(acc).then(() => toast("계좌번호 복사됨"));
}

function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2000);
}

// 초기화
renderHome();
</script>
</body>
</html>
